<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="11.6 12 40.8 40">
<!--
  The tray mark. Not the launcher icon shrunk: a panel draws this at 16, 22 or
  24 pixels beside a row of symbolic glyphs, and three things follow from that.

  It is a vector. The master this replaces was an 892 pixel photograph of the
  logo, and every tray size was a bilinear downscale of it, which is how a
  speech bubble arrives on the panel as a soft white lump with a smudge in it.
  Rasterised from here instead, the edges land on the pixel grid.

  It is one colour. Panels are dark, the icons beside this one are flat white
  silhouettes, and a green plate among them reads as a sticker somebody left on
  the shell. This is the same white the clock is.

  It is solid, with the handset cut out of it rather than drawn on top. An
  outlined bubble is a one pixel ring at this size, and one pixel of white on a
  dark panel is grey; a filled shape with a hole in it survives the same
  rasteriser intact. The fill rule is what cuts the hole: two subpaths, the
  bubble and the handset, and evenodd leaves the overlap empty.

  The comment sits inside the element on purpose. gdk-pixbuf decides what a file
  is by sniffing its first bytes, and twenty lines of prose in front of the root
  element pushed the tag out of the window it looks at: the loader answered
  "couldn't recognize the image file format" for a file that parses perfectly.
-->
  <path fill="#ffffff" fill-rule="evenodd" d="M32 13a19 19 0 0 0-19 19 19 19 0 0 0 2.284 8.995l-.035-.028c.958 2.25.888 2.863.737 4.742-.105 1.31-.46 2.647-.904 3.4-.402.681-.725 1.386-.725 1.565 0 .555 3.202.36 6.037-.366 3.152-.807 3.597-.89 5.959-.169l.073.024.301.09-.026-.02A19 19 0 0 0 32 51a19 19 0 0 0 19-19 19 19 0 0 0-19-19ZM39.126 40.368c1.424-.68 2.087-1.534 2.315-2.983.174-1.105.094-1.388-2.073-2.431-2.755-1.327-2.585-1.333-3.772.14-.739.918-1.056 1.215-1.296 1.215-2.807-.759-5.664-2.952-6.573-5.831 0-.123.299-.574.664-1.003 1.074-1.258 1.075-1.29.138-3.6-1.08-2.659-1.445-2.64-2.62-2.69-1.204-.049-1.585.142-2.346 1.18-.788 1.075-1.07 1.939-1.063 3.265.009 1.683.56 3.034 2.158 5.283 2.742 3.86 5.418 5.956 9.272 7.261 2.357.799 3.816.853 5.196.194Z"/>
</svg>
