<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
<!--
  Dardasha's launcher icon: a white speech bubble on a warm plate, its tail to
  the right, holding the letter dal. Original artwork for this project, drawn
  as plain paths so no font is needed to render it.
-->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb547"/>
      <stop offset="1" stop-color="#ef5638"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f58a3c"/>
      <stop offset="1" stop-color="#e2492f"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#plate)"/>
  <path fill="#fff" d="M50 28h28a26 26 0 0 1 26 26v8a26 26 0 0 1-22.4 25.7L96 102 66.8 88H50a26 26 0 0 1-26-26v-8a26 26 0 0 1 26-26z"/>
  <path fill="none" stroke="url(#ink)" stroke-width="9.5" stroke-linecap="round" stroke-linejoin="round" d="M57 41.5c9.5 4.5 17 12.5 17.5 24 .2 4-1.8 6.5-6 6.5H50"/>
</svg>
