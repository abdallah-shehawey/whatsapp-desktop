name: Bug report
description: Something doesn't work as expected
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Check the [troubleshooting guide](https://github.com/abdallah-shehawey/whatsapp-desktop/blob/main/docs/troubleshooting.md) first. Don't include phone numbers, message text, screenshots of private chats or session files.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the client
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown in About, in the tray menu.
      placeholder: "1.10.7"
    validations:
      required: true
  - type: dropdown
    id: install-method
    attributes:
      label: How did you install it?
      options:
        - shinux repository (dnf, apt or pacman)
        - Package from a GitHub release (rpm, deb or pkg.tar.zst)
        - AppImage
        - npm (GitHub Packages)
        - Built from source
        - Other
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Distribution and desktop
      placeholder: "Fedora 45, GNOME 51 on Wayland"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log output
      description: Run `whatsapp-desktop` from a terminal and paste the relevant lines. Remove any personal data first.
      render: shell
