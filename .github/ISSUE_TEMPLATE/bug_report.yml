name: Bug report
description: Report a reproducible problem with WhatsApp Desktop
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please do not include phone numbers, message content, screenshots of private conversations, or session data.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Application version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: distro
    attributes:
      label: Linux distribution and version
      placeholder: "Ubuntu 24.04"
    validations:
      required: true
  - type: input
    id: install-method
    attributes:
      label: Installation method
      placeholder: ".deb, .rpm, source tree, or other"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the application
        2. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste redacted logs only. Never include account data or message content.
      render: shell
