name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          # find rather than a list of globs: a new subdirectory under src/
          # would otherwise be skipped silently, and a file that never gets
          # checked is exactly the one that breaks a release build.
          find src tools -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run test suite
        run: make test
