name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          # find rather than a list of globs: a new subdirectory under src/
          # would otherwise be skipped silently, and a file that never gets
          # checked is exactly the one that breaks a release build.
          find src tools -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run test suite
        run: make test

  source-package:
    name: Source-only distribution packaging
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install distribution packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential nodejs python3 debhelper fontconfig desktop-file-utils appstream rpm

      - name: Build Debian binary from application source
        shell: bash
        run: |
          set -euo pipefail
          # In a Debian container, not on the runner: this build declares
          # nodejs (>= 20) for the X11 check in its test suite, and Ubuntu
          # 24.04's archive answers a bare nodejs with 18.19.1, so
          # dpkg-checkbuilddeps on the runner refuses the build. Trixie's
          # archive carries 20.19, which is the situation the package is
          # written for -- a distribution whose own Node satisfies it --
          # and the source is copied in so nothing roots the workspace.
          docker run --rm -v "$PWD:/src:ro" debian:trixie bash -euo pipefail -c '
            export DEBIAN_FRONTEND=noninteractive
            apt-get -qq update
            apt-get -qq -y install build-essential nodejs python3 debhelper \
              fontconfig desktop-file-utils appstream
            node --version
            cp -a /src /build
            cd /build
            dpkg-buildpackage -us -uc -b
          '

      - name: Build source review artifacts
        run: packaging/official/build-source-packages.sh

      - name: Save review artifacts
        uses: actions/upload-artifact@v4
        with:
          name: official-packaging-proposal
          path: dist/official/
