app-id: io.github.shehawey.whatsapp-desktop
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '24.08'
command: whatsapp-desktop

finish-args:
  # Display & Windowing
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  # Audio, Video & Calls
  - --socket=pulseaudio
  # The GPU only. NOT --device=all, which also hands over every input device on
  # the machine. The camera a video call needs is meant to come through the
  # Camera portal on org.freedesktop.portal.Desktop, which is allowed below --
  # if it turns out Electron opens /dev/video* directly here instead, this is
  # the line that has to become --device=all, and that trade is worth making
  # deliberately rather than by default.
  - --device=dri
  - --share=network
  # Filesystem
  - --filesystem=xdg-download
  - --filesystem=~/.config/whatsapp-desktop:create
  - --filesystem=~/.local/share/whatsapp-desktop:create
  # D-Bus Services (Tray, Notifications, MPRIS, Portals)
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.portal.Desktop
  - --talk-name=org.freedesktop.portal.ScreenCast
  - --talk-name=org.freedesktop.portal.GlobalShortcuts
  - --own-name=org.mpris.MediaPlayer2.whatsapp
  - --own-name=org.mpris.MediaPlayer2.whatsapp.*
  - --own-name=org.kde.StatusNotifierItem-*
  # Environment
  - --env=ELECTRON_OZONE_PLATFORM_HINT=auto

modules:
  - name: whatsapp-desktop
    buildsystem: simple
    build-commands:
      - make install PREFIX=/app
    sources:
      - type: dir
        path: ..
