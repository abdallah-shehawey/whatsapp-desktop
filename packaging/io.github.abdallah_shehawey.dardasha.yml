# A local development build of the Dardasha brand, from this checkout and the
# Electron that `npm install` put in node_modules -- `make package-flatpak`.
#
# This is NOT the Flathub submission and must not be copied into one. Flathub
# requires its manifest to be written without AI assistance, and this file was
# not; its sources are also a local directory, which Flathub does not build.
app-id: io.github.abdallah_shehawey.dardasha
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '24.08'
command: dardasha

finish-args:
  # Display & Windowing
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  # Audio, Video & Calls
  - --socket=pulseaudio
  # The GPU only. NOT --device=all, which also hands over every input device on
  # the machine. The camera a video call needs is meant to come through the
  # Camera portal on org.freedesktop.portal.Desktop, which is allowed below --
  # if it turns out Electron opens /dev/video* directly here instead, this is
  # the line that has to become --device=all, and that trade is worth making
  # deliberately rather than by default.
  - --device=dri
  - --share=network
  # Filesystem
  - --filesystem=xdg-download
  - --filesystem=~/.config/whatsapp-desktop:create
  - --filesystem=~/.local/share/whatsapp-desktop:create
  # D-Bus Services (Tray, Notifications, MPRIS, Portals)
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.portal.Desktop
  - --talk-name=org.freedesktop.portal.ScreenCast
  - --talk-name=org.freedesktop.portal.GlobalShortcuts
  - --own-name=org.mpris.MediaPlayer2.whatsapp
  - --own-name=org.mpris.MediaPlayer2.whatsapp.*
  - --own-name=org.kde.StatusNotifierItem-*
  # Environment
  - --env=ELECTRON_OZONE_PLATFORM_HINT=auto

modules:
  - name: whatsapp-desktop
    buildsystem: simple
    build-commands:
      - make install PREFIX=/app BRAND=dardasha SANDBOX_WRAPPER=zypak-wrapper
    sources:
      - type: dir
        path: ..
