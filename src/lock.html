<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp - Locked</title>
  <style>
    :root {
      --bg-color: #111b21;
      --bg-card: #202c33;
      --text-primary: #e9edef;
      --text-secondary: #8696a0;
      --accent: #00a884;
      --accent-hover: #029071;
      --border-color: #2a3942;
      --danger: #ef4444;
      --font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Arabic", sans-serif;
    }
    :root[data-theme="light"] {
      --bg-color: #f0f2f5;
      --bg-card: #ffffff;
      --text-primary: #111b21;
      --text-secondary: #667781;
      --accent: #00a884;
      --accent-hover: #029071;
      --border-color: #d1d7db;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: var(--bg-color);
      color: var(--text-primary);
      font-family: var(--font-family);
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .lock-card {
      width: 320px;
      padding: 32px 24px;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
      animation: popIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.95); }
      100% { opacity: 1; transform: scale(1); }
    }
    .lock-icon {
      width: 56px;
      height: 56px;
      border-radius: 28px;
      background: rgba(0, 168, 132, 0.15);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .lock-title {
      font-size: 18px;
      font-weight: 600;
      text-align: center;
    }
    .lock-subtitle {
      font-size: 13px;
      color: var(--text-secondary);
      text-align: center;
      margin-top: -12px;
    }
    .pin-input-wrap {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .pin-input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1.5px solid var(--border-color);
      background: var(--bg-color);
      color: var(--text-primary);
      font-size: 20px;
      letter-spacing: 4px;
      text-align: center;
      outline: none;
      transition: border-color 0.15s ease;
    }
    .pin-input:focus {
      border-color: var(--accent);
    }
    .error-msg {
      font-size: 12px;
      color: var(--danger);
      min-height: 18px;
      text-align: center;
    }
    .unlock-btn {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      background: var(--accent);
      color: #ffffff;
      border: none;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .unlock-btn:hover {
      background: var(--accent-hover);
    }
    .shake {
      animation: shake 0.3s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }
    @keyframes shake {
      10%, 90% { transform: translate3d(-2px, 0, 0); }
      20%, 80% { transform: translate3d(4px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
      40%, 60% { transform: translate3d(6px, 0, 0); }
    }
  </style>
</head>
<body>

  <div class="lock-card" id="lockCard">
    <div class="lock-icon">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
    </div>
    <div class="lock-title">WhatsApp Locked</div>
    <div class="lock-subtitle">Enter passcode to unlock</div>

    <div class="pin-input-wrap">
      <input type="password" id="pinInput" class="pin-input" placeholder="••••" autofocus autocomplete="off" maxlength="32">
      <div class="error-msg" id="errorMsg"></div>
      <button class="unlock-btn" id="unlockBtn">Unlock</button>
    </div>
  </div>

  <script>
    const pinInput = document.getElementById('pinInput');
    const unlockBtn = document.getElementById('unlockBtn');
    const errorMsg = document.getElementById('errorMsg');
    const lockCard = document.getElementById('lockCard');

    async function attemptUnlock() {
      const pin = pinInput.value;
      if (!pin) return;
      errorMsg.textContent = '';
      if (window.api && window.api.unlock) {
        try {
          const answer = await window.api.unlock(pin);
          /* A wrong passcode and a lockout are different things to be told:
             after five wrong answers there is a wait, and "Incorrect passcode"
             on a correct one typed during that wait is a lie that sends
             somebody looking for a passcode they have not forgotten. */
          if (answer && answer.ok) return;
          triggerError((answer && answer.wait) || 'Incorrect passcode');
        } catch (err) {
          triggerError(err.message || 'Unlock failed');
        }
      }
    }

    function triggerError(msg) {
      errorMsg.textContent = msg;
      lockCard.classList.remove('shake');
      void lockCard.offsetWidth; // trigger reflow
      lockCard.classList.add('shake');
      pinInput.value = '';
      pinInput.focus();
    }

    unlockBtn.addEventListener('click', attemptUnlock);
    pinInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') attemptUnlock();
    });

    // Check theme
    if (window.api && window.api.getTheme) {
      window.api.getTheme().then(theme => {
        document.documentElement.setAttribute('data-theme', theme);
      });
    }
  </script>
</body>
</html>
